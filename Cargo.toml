[package]
name = "webos-iptv-rs"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A Rust IPTV player for LG webOS"
repository = "https://github.com/dedmen7/webos-iptv-rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
quick-xml = { version = "0.42", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
url = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
web-sys = { version = "0.3", features = [
  "AbortController", "AbortSignal", "Blob", "BlobPropertyBag", "Document", "DomRect",
  "Element", "HtmlCollection", "Event", "EventTarget", "Headers", "HtmlButtonElement", "HtmlElement",
  "HtmlInputElement", "HtmlImageElement", "HtmlMediaElement", "HtmlSelectElement", "HtmlTrackElement",
  "HtmlVideoElement", "IdbDatabase", "IdbFactory", "IdbObjectStore", "IdbOpenDbRequest",
  "IdbRequest", "IdbTransaction", "IdbTransactionMode", "KeyboardEvent", "Location",
  "Node", "NodeList", "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit", "Request", "RequestInit", "Response", "ScrollIntoViewOptions",
  "ScrollLogicalPosition", "Storage", "TextTrack", "TextTrackKind", "TextTrackList", "TextTrackMode",
  "Url", "Window"
] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "debuginfo"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = "0.22"
png = "0.18"
