[package]
name = "webos-iptv-rs"
version = "0.1.62"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
description = "A Rust IPTV player for LG webOS"
repository = "https://github.com/dedmen7/webos-iptv-rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
memchr = "2"
quick-xml = { version = "0.42", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
url = { version = "2", features = ["serde"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64 = "0.22"
miniz_oxide = "0.8"
js-sys = "0.3"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
web-sys = { version = "0.3", features = [
  "AbortController", "AbortSignal", "AesGcmParams", "AnalyserNode", "AudioContext", "AudioContextState", "AudioDestinationNode", "AudioNode", "AudioParam", "BaseAudioContext", "Crypto", "CryptoKey", "GainNode", "MediaStream", "MediaStreamAudioSourceNode", "MediaStreamTrack", "Blob", "BlobPropertyBag", "CustomEvent", "Document", "DomRect", "DomStringList", "SubtleCrypto",
  "Element", "HtmlCollection", "Event", "EventTarget", "Headers", "HtmlButtonElement", "HtmlElement",
  "HtmlInputElement", "HtmlImageElement", "HtmlMediaElement", "HtmlTrackElement",
  "HtmlVideoElement", "IdbDatabase", "IdbFactory", "IdbObjectStore", "IdbOpenDbRequest",
  "IdbRequest", "IdbTransaction", "IdbTransactionMode", "KeyboardEvent", "Location",
  "MediaError", "MouseEvent", "Navigator", "Node", "NodeList", "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit", "Performance", "ReadableStream", "ReadableStreamDefaultReader", "Request", "RequestCache", "RequestInit", "Response", "ScrollIntoViewOptions",
  "ScrollLogicalPosition", "Storage", "TextTrack", "TextTrackKind", "TextTrackList", "TextTrackMode",
  "TimeRanges", "Url", "Window"
] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "debuginfo"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = "0.22"
